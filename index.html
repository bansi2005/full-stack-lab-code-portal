<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thinkering Lab | Arduino Programs</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
  min-height: 100vh;
}

header {
  background: #172337;
  padding: 25px 15px;
  text-align: center;
  border-bottom: 2px solid #263c59;
}

header h1 {
  color: #38bdf8;
  font-size: 28px;
}

header p {
  color: #aabbd0;
  margin-top: 8px;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 25px 15px;
}

#login {
  max-width: 380px;
  margin: 100px auto;
  padding: 30px;
  background: #1e2b40;
  border-radius: 15px;
  text-align: center;
}

#login h2 {
  color: #38bdf8;
  margin-bottom: 20px;
}

input {
  width: 100%;
  padding: 13px;
  margin: 12px 0;
  border: 1px solid #40516a;
  border-radius: 8px;
  background: #101827;
  color: white;
  font-size: 16px;
}

button {
  border: none;
  padding: 11px 18px;
  border-radius: 7px;
  cursor: pointer;
  font-size: 14px;
  font-weight: bold;
}

.login-btn {
  width: 100%;
  background: #0284c7;
  color: white;
}

#message {
  color: #fb7185;
  margin-top: 12px;
}

#portal {
  display: none;
}

.search {
  margin-bottom: 25px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 18px;
}

.card {
  background: #1e2b40;
  padding: 22px;
  border: 1px solid #344760;
  border-radius: 12px;
  transition: 0.2s;
}

.card:hover {
  border-color: #38bdf8;
  transform: translateY(-3px);
}

.card h3 {
  color: #38bdf8;
  margin-bottom: 12px;
}

.card p {
  color: #bdc9d8;
  font-size: 14px;
  line-height: 1.5;
  min-height: 42px;
  margin-bottom: 18px;
}

.view-btn {
  background: #0284c7;
  color: white;
}

.copy-btn {
  background: #16a34a;
  color: white;
  margin-left: 5px;
}

.buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

#viewer {
  display: none;
  margin-top: 25px;
  background: #1e2b40;
  padding: 20px;
  border-radius: 12px;
  border: 1px solid #38bdf8;
}

.viewer-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 15px;
}

.viewer-top h2 {
  color: #38bdf8;
  font-size: 20px;
}

pre {
  background: #080f1b;
  padding: 18px;
  border-radius: 8px;
  overflow-x: auto;
  white-space: pre;
  color: #a7f3d0;
  font-size: 14px;
  line-height: 1.6;
}

.close-btn {
  background: #dc2626;
  color: white;
}

footer {
  text-align: center;
  padding: 25px;
  color: #8294aa;
  font-size: 13px;
}

@media(max-width: 500px) {
  header h1 {
    font-size: 23px;
  }

  .viewer-top h2 {
    font-size: 17px;
  }

  pre {
    font-size: 12px;
  }
}
</style>
</head>

<body>

<header>
  <h1>⚡ THINKERING LAB</h1>
  <p>Arduino Programming Code Portal</p>
</header>

<!-- PIN LOGIN -->
<div id="login">
  <h2>Lab Access</h2>
  <p>Enter PIN to access Arduino programs</p>

  <input type="password" id="pin"
  placeholder="Enter Access PIN">

  <button class="login-btn" onclick="login()">
    ENTER PORTAL
  </button>

  <p id="message"></p>
</div>

<!-- MAIN WEBSITE -->
<div id="portal" class="container">

  <h2 style="color:#38bdf8;margin-bottom:10px;">
    Arduino Experiments
  </h2>

  <p style="color:#aabbd0;margin-bottom:20px;">
    Select an experiment to view or copy its complete code.
  </p>

  <input class="search" id="search"
  placeholder="Search experiments..."
  oninput="showCards()">

  <div class="cards" id="cards"></div>

  <!-- CODE VIEWER -->
  <div id="viewer">
    <div class="viewer-top">
      <h2 id="codeTitle">Program Code</h2>

      <div class="buttons">
        <button class="copy-btn" onclick="copyCode()">
          COPY CODE
        </button>

        <button class="close-btn" onclick="closeCode()">
          CLOSE
        </button>
      </div>
    </div>

    <pre><code id="codeContent"></code></pre>
  </div>

</div>

<footer>
  THINKERING LAB | Arduino Experiments
</footer>

<script>

// LOGIN
function login() {
  let pin = document.getElementById("pin").value;

  if (pin === "2580") {
    document.getElementById("login").style.display = "none";
    document.getElementById("portal").style.display = "block";
  } else {
    document.getElementById("message").innerText =
      "Incorrect PIN! Try again.";
  }
}

document.getElementById("pin").addEventListener("keydown", function(e) {
  if (e.key === "Enter") login();
});


// ALL ARDUINO PROGRAMS
const programs = [

{
 title: "Fire Sensor with LED and Buzzer",
 description: "Detect fire using a fire sensor and activate an LED and buzzer.",
 code: `int led = 9;
int buzzer = 12;
int fire = 2;

void setup()
{
  pinMode(led, OUTPUT);
  pinMode(buzzer, OUTPUT);
  pinMode(fire, INPUT);

  Serial.begin(9600);
}

void loop()
{
  int value = digitalRead(fire);

  Serial.println(value);

  if (value == 0)
  {
    digitalWrite(led, HIGH);
    digitalWrite(buzzer, HIGH);
  }
  else
  {
    digitalWrite(led, LOW);
    digitalWrite(buzzer, LOW);
  }
}`
},

{
 title: "Automatic Door using Ultrasonic Sensor",
 description: "Detect a person and automatically open or close the door using a servo motor.",
 code: `#include <Servo.h>

Servo s;

int trig = 9;
int echo = 10;
int distance;
int time;

void setup()
{
  pinMode(trig, OUTPUT);
  pinMode(echo, INPUT);
  s.attach(6);
}

void loop()
{
  digitalWrite(trig, LOW);
  delayMicroseconds(2);

  digitalWrite(trig, HIGH);
  delayMicroseconds(10);
  digitalWrite(trig, LOW);

  time = pulseIn(echo, HIGH);
  distance = time * 0.034 / 2;

  if (distance < 10 && distance > 0)
  {
    s.write(90);
  }
  else
  {
    s.write(0);
  }

  delay(100);
}`
},

{
 title: "Automatic Railway Gate",
 description: "Use an ultrasonic sensor and two servo motors to control a railway gate.",
 code: `#include <Servo.h>

Servo right_servo;
Servo left_servo;

int trig = 8;
int echo = 9;
int time;
int distance;

void setup()
{
  Serial.begin(9600);

  pinMode(trig, OUTPUT);
  pinMode(echo, INPUT);

  right_servo.attach(10);
  left_servo.attach(11);
}

void loop()
{
  digitalWrite(trig, LOW);
  delayMicroseconds(2);

  digitalWrite(trig, HIGH);
  delayMicroseconds(10);
  digitalWrite(trig, LOW);

  time = pulseIn(echo, HIGH);
  distance = time * 0.034 / 2;

  Serial.println(distance);

  if (distance <= 10 && distance > 0)
  {
    right_servo.write(90);
    left_servo.write(90);
  }
  else
  {
    right_servo.write(0);
    left_servo.write(0);
  }

  delay(100);
}`
},

{
 title: "Arduino Servo Dustbin Lock Control",
 description: "Lock and unlock a dustbin using serial monitor commands and a servo motor.",
 code: `#include <Servo.h>

Servo dustbin;

void setup()
{
  dustbin.attach(10);
  Serial.begin(9600);

  dustbin.write(0);

  Serial.println("Enter lock or unlock");
}

void loop()
{
  if (Serial.available())
  {
    String cmd = Serial.readStringUntil('\\n');
    cmd.trim();

    if (cmd == "lock")
    {
      dustbin.write(0);
      Serial.println("Dustbin Locked");
    }
    else if (cmd == "unlock")
    {
      dustbin.write(90);
      Serial.println("Dustbin Unlocked");
    }
    else
    {
      Serial.println("Invalid Command");
    }
  }
}`
},

{
 title: "Arduino LED Blinking in Tinkercad",
 description: "Simulate LED blinking using Arduino built-in LED and digital pins 12 and 11.",
 code: `void setup()
{
  pinMode(LED_BUILTIN, OUTPUT);
  pinMode(12, OUTPUT);
  pinMode(11, OUTPUT);
}

void loop()
{
  digitalWrite(LED_BUILTIN, HIGH);
  delay(400);
  digitalWrite(LED_BUILTIN, LOW);

  digitalWrite(12, HIGH);
  delay(400);
  digitalWrite(12, LOW);

  digitalWrite(11, HIGH);
  delay(400);
  digitalWrite(11, LOW);
}`
}

];


// DISPLAY EXPERIMENT CARDS
function showCards() {
  let search = document.getElementById("search")
    .value.toLowerCase();

  let html = "";

  programs.forEach((p, i) => {
    if ((p.title + p.description).toLowerCase().includes(search)) {
      html += `
        <div class="card">
          <h3>${i + 1}. ${p.title}</h3>
          <p>${p.description}</p>

          <div class="buttons">
            <button class="view-btn" onclick="viewCode(${i})">
              VIEW CODE
            </button>

            <button class="copy-btn" onclick="copyProgram(${i}, this)">
              COPY CODE
            </button>
          </div>
        </div>
      `;
    }
  });

  document.getElementById("cards").innerHTML =
    html || "<p>No experiments found.</p>";
}


// VIEW CODE
function viewCode(index) {
  document.getElementById("codeTitle").innerText =
    programs[index].title;

  document.getElementById("codeContent").textContent =
    programs[index].code;

  document.getElementById("viewer").style.display = "block";

  document.getElementById("viewer").scrollIntoView({
    behavior: "smooth"
  });
}


// COPY SELECTED CODE
function copyProgram(index, button) {
  copyText(programs[index].code, button);
}


// COPY FROM VIEWER
function copyCode() {
  let code = document.getElementById("codeContent").textContent;
  copyText(code, document.querySelector("#viewer .copy-btn"));
}


// COMMON COPY FUNCTION
function copyText(code, button) {
  const original = button.innerText;

  function success() {
    button.innerText = "COPIED ✓";
    setTimeout(() => {
      button.innerText = original;
    }, 1500);
  }

  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(code)
      .then(success)
      .catch(() => fallbackCopy(code, button, success));
  } else {
    fallbackCopy(code, button, success);
  }
}


// COPY FALLBACK
function fallbackCopy(code, button, success) {
  let area = document.createElement("textarea");
  area.value = code;
  area.style.position = "fixed";
  area.style.opacity = "0";

  document.body.appendChild(area);
  area.select();

  try {
    if (document.execCommand("copy")) {
      success();
    } else {
      alert("Copy failed. Please select and copy the code manually.");
    }
  } catch (e) {
    alert("Copy failed. Please copy manually.");
  }

  document.body.removeChild(area);
}


// CLOSE CODE VIEWER
function closeCode() {
  document.getElementById("viewer").style.display = "none";
}

showCards();

</script>

</body>
</html>
