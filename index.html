code:`class Graph:
    def __init__(self, graph):
        self.graph = graph

    def get_neighbors(self, node):
        return self.graph[node]

    def a_star(self, start, stop):
        open_list = {start}
        closed_list = set()

        cost = {start: 0}
        parent = {start: start}

        while open_list:
            n = min(open_list, key=lambda x: cost[x] + 1)

            if n == stop:
                path = []

                while parent[n] != n:
                    path.append(n)
                    n = parent[n]

                path.append(start)
                path.reverse()

                print("Path found:", path)
                return path

            for neighbour, weight in self.get_neighbors(n):
                new_cost = cost[n] + weight

                if neighbour not in cost or new_cost < cost[neighbour]:
                    cost[neighbour] = new_cost
                    parent[neighbour] = n
                    open_list.add(neighbour)

            open_list.remove(n)
            closed_list.add(n)

        print("Path does not exist")

adj_list = {

    'D': []
}

code:`import numpy as np

def find_neighbours(state, landscape):
    neighbours = []
    rows, cols = landscape.shape

    x, y = state

    if x > 0:
        neighbours.append((x - 1, y))
    if x < rows - 1:
        neighbours.append((x + 1, y))
    if y > 0:
        neighbours.append((x, y - 1))
    if y < cols - 1:
        neighbours.append((x, y + 1))

    return neighbours

def hill_climb(landscape):
    current = (0, 0)

    while True:
        neighbours = find_neighbours(current, landscape)
        best = current

        for point in neighbours:
            if landscape[point] > landscape[best]:
                best = point

        if best == current:
            break

        current = best

    print("Best position:", current)
    print("Maximum value:", landscape[current])

code:`from sys import maxsize
from itertools import permutations

def travellingSalesmanProblem(graph, s):
    vertex = []

    for i in range(len(graph)):
        if i != s:
            vertex.append(i)

    min_path = maxsize

    next_permutation = permutations(vertex)

    for route in next_permutation:
        current_pathweight = 0
        k = s

        for j in route:
            current_pathweight += graph[k][j]
            k = j

        current_pathweight += graph[k][s]
        min_path = min(min_path, current_pathweight)

    return min_path

lang:"Python",
q:"Write a program to implement Simulated Annealing Algorithm.",
desc:"Simulated Annealing is an optimization algorithm that sometimes accepts worse solutions to search for a global optimum.",
input:"Area: -6 to 6\nTemperature: 12\nIterations: 1200\nStep size: 0.1",
output:"Displays the optimization graph.",
note:"Requires NumPy and Matplotlib. Install using: pip install numpy matplotlib",
code:`from numpy import asarray, exp
from numpy.random import randn, rand, seed
from matplotlib import pyplot

def objective(step):
    return step[0] ** 2.0

def sa(objective, area, iterations, step_size, temperature):

    start_point = area[:, 0] + rand(len(area)) * (
        area[:, 1] - area[:, 0]
    )

    start_point_eval = objective(start_point)

    mia_start_point = start_point.copy()
    mia_start_eval = start_point_eval

    outputs = []

    for i in range(iterations):

        mia_step = mia_start_point + randn(len(area)) * step_size
        mia_step_eval = objective(mia_step)

        difference = mia_step_eval - mia_start_eval
        t = temperature / float(i + 1)

        mac = exp(-difference / t)

        if difference < 0 or rand() < mac:
            mia_start_point = mia_step
            mia_start_eval = mia_step_eval

        if mia_start_eval < start_point_eval:
            start_point = mia_start_point.copy()
            start_point_eval = mia_start_eval

        outputs.append(start_point_eval)

    return [start_point, start_point_eval, outputs]

seed(1)

area = asarray([[-6.0, 6.0]])
temperature = 12
iterations = 1200
step_size = 0.1

start_point, output, outputs = sa(
    objective, area, iterations, step_size, temperature
)

print("Best point:", start_point)
print("Best value:", output)

pyplot.plot(outputs, 'ro-')
pyplot.xlabel('Improvement Value')
pyplot.ylabel('Evaluation of Objective Function')

n:8,
title:"8 Puzzle Problem",
lang:"Python",
q:"Write a program to implement 8 Puzzle Problem.",
desc:"Arrange eight numbered tiles into the goal configuration by moving the empty space.",
input:"Initial state:\n1 2 3\n5 6 0\n7 8 4\n\nGoal state:\n1 2 3\n5 8 6\n0 7 4",
output:"Solution moves are displayed.",
note:"This is a priority-queue Branch and Bound implementation. It uses a visited-state set to avoid repeating states.",
code:`import heapq

start = (1, 2, 3, 5, 6, 0, 7, 8, 4)
goal = (1, 2, 3, 5, 8, 6, 0, 7, 4)

def calculateCost(state):
    cost = 0

    for i in range(9):
        if state[i] != 0 and state[i] != goal[i]:
            cost += 1

    return cost

def solve():
    queue = []
    heapq.heappush(queue, (calculateCost(start), 0, start, []))

    visited = set()

    while queue:
        priority, level, state, path = heapq.heappop(queue)

        if state == goal:
            print("Solution:")
            print(path)
            return

        if state in visited:
            continue

        visited.add(state)

        zero = state.index(0)
        row, col = divmod(zero, 3)

        moves = [
            (-1, 0, "UP"),
            (1, 0, "DOWN"),
            (0, -1, "LEFT"),
            (0, 1, "RIGHT")
        ]

        for dr, dc, name in moves:
            nr = row + dr
            nc = col + dc

            if 0 <= nr < 3 and 0 <= nc < 3:
                new_pos = nr * 3 + nc

                new_state = list(state)
                new_state[zero], new_state[new_pos] = (
                    new_state[new_pos], new_state[zero]
                )

                new_state = tuple(new_state)

                if new_state not in visited:
                    new_path = path + [name]
                    new_level = level + 1

                    heapq.heappush(
                        queue,
                        (
                            new_level + calculateCost(new_state),
                            new_level,
                            new_state,
                            new_path
                        )
                    )

    print("No solution found")

code:`class ItemValue:
    def __init__(self, weight, value):
        self.weight = weight
        self.value = value
        self.cost = value / weight

def getMaxValue(weights, values, capacity):

    items = []

    for i in range(len(weights)):
        items.append(
            ItemValue(weights[i], values[i])
        )

    items.sort(
        key=lambda x: x.cost,
        reverse=True
    )

    total = 0

    for item in items:

        if capacity >= item.weight:
            capacity -= item.weight
            total += item.value

        else:
            total += item.cost * capacity
            break

    return total

function login() {
    const pin = document.getElementById("pin").value;

    if (pin === "2580") {
        document.getElementById("login").style.display = "none";
        document.getElementById("portal").style.display = "block";
        showPrograms();

document.getElementById("pin").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        login();
    }
});

// DISPLAY PROGRAMS
function showPrograms() {

    const search = document.getElementById("search").value.toLowerCase();
    const list = document.getElementById("programList");

    list.innerHTML = "";

    const filtered = programs.filter(p =>
        String(p.n).includes(search) ||
        p.title.toLowerCase().includes(search) ||
        p.q.toLowerCase().includes(search) ||
        p.lang.toLowerCase().includes(search)
    );

    if (filtered.length === 0) {
        list.textContent = "No programs found.";
        return;
    }

    filtered.forEach(p => {

        const card = document.createElement("div");
        card.className = "card";

        const heading = document.createElement("h3");
        heading.textContent = p.n + ". " + p.title;

        const question = document.createElement("p");
        question.textContent = p.q;

        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = p.lang;

        const description = document.createElement("p");
        description.textContent = p.desc;

        const view = document.createElement("button");
        view.className = "view";
        view.textContent = "View Code";

        const copy = document.createElement("button");
        copy.textContent = "Copy Code";

        const details = document.createElement("div");
        details.className = "details";

        view.onclick = function() {
            details.style.display =
                details.style.display === "block" ? "none" : "block";
        };

        copy.onclick = async function() {
            try {
                await navigator.clipboard.writeText(p.code);
                copy.textContent = "Copied!";
            } catch (error) {
                const area = document.createElement("textarea");
                area.value = p.code;
                document.body.appendChild(area);
                area.select();
                document.execCommand("copy");
                area.remove();
                copy.textContent = "Copied!";
            }

            setTimeout(() => {
                copy.textContent = "Copy Code";
            }, 1500);
        };

        function addHeading(text) {
            const h = document.createElement("h4");
            h.textContent = text;
            details.appendChild(h);
        }

        function addText(text) {
            const p = document.createElement("p");
            p.textContent = text;
            details.appendChild(p);
        }

        addHeading("Question");
        addText(p.q);

        addHeading("Description");
        addText(p.desc);

        if (p.input) {
            addHeading("Input");
            addText(p.input);
        }

        if (p.output) {
            addHeading("Expected Output");
            addText(p.output);
        }

        if (p.note) {
            addHeading("Important Note");
            const note = document.createElement("p");
            note.className = "note";
            note.textContent = p.note;
            details.appendChild(note);
        }

        if (p.code) {
            addHeading("Source Code");

            const pre = document.createElement("pre");
            const code = document.createElement("code");

            code.textContent = p.code;

            pre.appendChild(code);
            details.appendChild(pre);
        }

        card.appendChild(heading);
        card.appendChild(question);
        card.appendChild(tag);
        card.appendChild(description);
        card.appendChild(view);
        card.appendChild(copy);
        card.appendChild(details);

        list.appendChild(card);
    });
}
