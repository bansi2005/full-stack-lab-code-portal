
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thinkering Lab - AI Lab</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #000;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 25px 10px;
  background: #111;
  border-bottom: 1px solid #444;
}

header h1 {
  font-size: 26px;
  margin-bottom: 8px;
}

header p {
  color: #aaa;
  font-size: 14px;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 25px 15px;
}

#login {
  max-width: 350px;
  margin: 100px auto;
  padding: 25px;
  text-align: center;
  background: #171717;
  border: 1px solid #444;
  border-radius: 8px;
}

#login h2 {
  margin-bottom: 15px;
}

input {
  width: 100%;
  padding: 12px;
  margin: 15px 0;
  background: black;
  color: white;
  border: 1px solid #555;
  border-radius: 5px;
}

button {
  padding: 10px 15px;
  background: #333;
  color: white;
  border: 1px solid #555;
  border-radius: 5px;
  cursor: pointer;
}

button:hover {
  background: #555;
}

.login-btn {
  width: 100%;
}

#message {
  margin-top: 12px;
  color: #ccc;
}

#portal {
  display: none;
}

.heading {
  margin-bottom: 10px;
  font-size: 23px;
}

.subtitle {
  color: #aaa;
  margin-bottom: 20px;
  font-size: 14px;
}

.cards {
  display: grid;
  grid-template-columns:
    repeat(auto-fit, minmax(250px, 1fr));
  gap: 15px;
}

.card {
  background: #171717;
  border: 1px solid #444;
  padding: 18px;
  border-radius: 7px;
}

.card h3 {
  font-size: 16px;
  margin-bottom: 12px;
}

.question-no {
  color: #aaa;
  font-size: 13px;
  margin-bottom: 8px;
}

.card p {
  color: #bbb;
  font-size: 14px;
  line-height: 1.5;
  margin-bottom: 18px;
}

.buttons {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

#viewer {
  display: none;
  background: #171717;
  border: 1px solid #555;
  padding: 20px;
  margin-top: 25px;
  border-radius: 7px;
}

.viewer-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 18px;
}

.viewer-top h2 {
  font-size: 18px;
}

#questionContent {
  color: #ddd;
  line-height: 1.8;
  font-size: 15px;
  white-space: pre-wrap;
}

footer {
  text-align: center;
  padding: 25px;
  color: #888;
  font-size: 12px;
}

@media(max-width: 500px) {
  header h1 {
    font-size: 22px;
  }

  .card {
    padding: 15px;
  }
}
</style>
</head>

<body>

<header>
  <h1>THINKERING LAB</h1>
  <p>Artificial Intelligence Lab - Program Portal</p>
</header>

<!-- LOGIN -->

<div id="login">
  <h2>Lab Access</h2>
  <p>Enter PIN to continue</p>

  <input type="password" id="pin"
  placeholder="Enter PIN">

  <button class="login-btn" onclick="login()">
    ENTER
  </button>

  <p id="message"></p>
</div>

<!-- MAIN PORTAL -->

<div id="portal" class="container">

  <h2 class="heading">AI Lab Programs</h2>

  <p class="subtitle">
    Total Questions: 16
  </p>

  <input type="text" id="search"
  placeholder="Search questions..."
  oninput="showQuestions()">

  <div class="cards" id="cards"></div>

  <!-- QUESTION VIEWER -->

  <div id="viewer">

    <div class="viewer-top">

      <h2 id="questionTitle"></h2>

      <div class="buttons">

        <button onclick="copyQuestion()">
          COPY QUESTION
        </button>

        <button onclick="closeQuestion()">
          CLOSE
        </button>

      </div>

    </div>

    <p id="questionContent"></p>

  </div>

</div>

<footer>
  THINKERING LAB | AI LAB PROGRAMS
</footer>

<script>

// LOGIN

function login() {

  let pin = document.getElementById("pin").value;

  if (pin === "2580") {

    document.getElementById("login").style.display = "none";
    document.getElementById("portal").style.display = "block";

  } else {

    document.getElementById("message").innerText =
      "Incorrect PIN. Try again.";

  }
}

document.getElementById("pin").addEventListener("keydown", function(e) {
  if (e.key === "Enter") login();
});


// ALL 16 AI LAB QUESTIONS

const questions = [

{
no: 1,
title: "Depth First Search (DFS)",
question: `1. Write a program to implement DFS.

Implement the Depth First Search algorithm to traverse a graph using a stack or recursion.

Display the visited vertices starting from the given vertex.`
},

{
no: 2,
title: "Breadth First Search (BFS)",
question: `2. Write a program to implement BFS.

Implement the Breadth First Search algorithm to traverse a graph using a queue.

Display the visited vertices starting from the given vertex.`
},

{
no: 3,
title: "A* Algorithm",
question: `3. Write a program to implement A* algorithm.

Implement A* search using the path cost and heuristic value to find an optimal path between the start node and goal node.`
},

{
no: 4,
title: "Hill Climbing Problem",
question: `4. Write a program to implement Hill Climbing Problem.

Implement the Hill Climbing algorithm to find the highest-valued neighbouring state and continue until no better state is available.`
},

{
no: 5,
title: "Towers of Hanoi",
question: `5. Write a program to implement Towers of Hanoi problem.

Move all disks from the starting rod to the destination rod using an auxiliary rod.

Rules:
1. Move only one disk at a time.
2. A larger disk cannot be placed on a smaller disk.
3. Use the auxiliary rod to complete the movement.`
},

{
no: 6,
title: "Travelling Salesman Problem",
question: `6. Write a program to find the solution for Travelling Salesman Problem.

Given a set of cities and distances between every pair of cities, find the shortest possible route that visits every city exactly once and returns to the starting point.`
},

{
no: 7,
title: "Simulated Annealing",
question: `7. Write a program to implement Simulated Annealing Algorithm.

Implement Simulated Annealing to find an optimal solution using random changes, temperature and acceptance probability.

Demonstrate how the algorithm can accept a worse solution to avoid getting stuck at local optima.`
},

{
no: 8,
title: "8 Puzzle Problem",
question: `8. Write a program to implement 8 Puzzle Problem.

Given a 3x3 board containing eight numbered tiles and one empty space, move the adjacent tiles into the empty space to reach the final configuration.

Use a search technique to find the solution.`
},

{
no: 9,
title: "Wumpus World Problem",
question: `9. Implement Wumpus World Problem.

Implement the Wumpus World environment to demonstrate an intelligent knowledge-based agent.

The agent should identify hazards, collect information from the environment and try to reach its goal safely.`
},

{
no: 10,
title: "Chatbot using AWS Lex and Pandora Bots",
question: `10. Build a Chatbot using AWS Lex, Pandora bots.

Create and configure a chatbot using AWS Lex or Pandora Bots.

Configure the bot, provide suitable responses and test the chatbot through user conversations.`
},

{
no: 11,
title: "College Information Chatbot",
question: `11. Build a bot which provides all the information related to your college.

Create a chatbot using Python ChatterBot that provides information about your college.

The bot should respond to user questions using its trained conversational data.`
},

{
no: 12,
title: "Wikipedia Virtual Assistant",
question: `12. Build A Virtual Assistant For Wikipedia Using Wolfram Alpha And Python.

Create a simple Python assistant using the Wolfram Alpha API.

The assistant should accept questions from the user and display answers.

Example:
Input: What is the capital of India?
Output: New Delhi

Input: What is sin(30)?
Output: 0.5`
},

{
no: 13,
title: "Recursive Substring Counting",
question: `13. The following is a function that counts the number of times a string occurs in another string:

Write a recursive version of the above function.

For example:
countsubstring('ab', 'cabalaba') returns 2.

Use recursion to count the occurrences of a substring.`
},

{
no: 14,
title: "Higher Order Functions",
question: `14. Higher order functions.

Write a higher-order function count that counts the number of elements in a list that satisfy a given test.

For example:
count(lambda x: x>2, [1,2,3,4,5])

Expected output:
3

Solve this task without using any existing higher-order function.`
},

{
no: 15,
title: "Knapsack Problem",
question: `15. Brute force solution to the Knapsack problem.

Write a function that generates random problem instances for the knapsack program.

Generate N items with:
1. Unique item names.
2. Random size between 1 and 5.
3. Random value between 1 and 10.

Perform at least 10 runs for problem sizes:
10, 12, 14, 16, 18, 20 and 22.

Use different backpack capacities and measure the execution time.

Observe how the number of items and backpack size affect performance.`
},

{
no: 16,
title: "Graph Coloring Problem",
question: `16. Assume that you are organising a party for N people and have been given a list L of people who, for social reasons, should not sit at the same table.

Assume that you have C tables.

Write a function layout(N,C,L) that assigns each guest to a table so that no restricted pair sits together.

If no valid arrangement is possible, return False.

Solve the problem using the Graph Coloring approach.`
}

];


// DISPLAY QUESTIONS

function showQuestions() {

  let search = document.getElementById("search")
    .value.toLowerCase();

  let html = "";

  questions.forEach((q, index) => {

    if ((q.title + q.question).toLowerCase().includes(search)) {

      html += `
        <div class="card">

          <div class="question-no">
            QUESTION ${String(q.no).padStart(2, "0")}
          </div>

          <h3>${q.title}</h3>

          <p>${q.question.split("\n")[0]}</p>

          <div class="buttons">

            <button onclick="viewQuestion(${index})">
              VIEW QUESTION
            </button>

            <button onclick="copyOne(${index}, this)">
              COPY QUESTION
            </button>

          </div>

        </div>
      `;
    }

  });

  document.getElementById("cards").innerHTML =
    html || "<p>No questions found.</p>";
}


// VIEW QUESTION

function viewQuestion(index) {

  document.getElementById("questionTitle").innerText =
    "QUESTION " + String(questions[index].no).padStart(2, "0");

  document.getElementById("questionContent").innerText =
    questions[index].question;

  document.getElementById("viewer").style.display = "block";

  document.getElementById("viewer").scrollIntoView({
    behavior: "smooth"
  });
}


// COPY QUESTION

function copyOne(index, button) {
  copyText(questions[index].question, button);
}

function copyQuestion() {

  let text = document.getElementById("questionContent").innerText;

  copyText(text, document.querySelector("#viewer .buttons button"));

}


// COMMON COPY FUNCTION

function copyText(text, button) {

  let oldText = button.innerText;

  function done() {

    button.innerText = "COPIED ✓";

    setTimeout(function() {
      button.innerText = oldText;
    }, 1500);

  }

  if (navigator.clipboard && window.isSecureContext) {

    navigator.clipboard.writeText(text)
      .then(done)
      .catch(function() {
        fallbackCopy(text, done);
      });

  } else {

    fallbackCopy(text, done);

  }

}


// FALLBACK COPY

function fallbackCopy(text, done) {

  let area = document.createElement("textarea");

  area.value = text;
  area.style.position = "fixed";
  area.style.opacity = "0";

  document.body.appendChild(area);
  area.select();

  try {

    if (document.execCommand("copy")) {
      done();
    } else {
      alert("Copy failed. Please copy manually.");
    }

  } catch(e) {

    alert("Copy failed. Please copy manually.");

  }

  document.body.removeChild(area);

}


// CLOSE VIEWER

function closeQuestion() {

  document.getElementById("viewer").style.display = "none";

}


// LOAD QUESTIONS

showQuestions();

</script>

</body>
</html>
