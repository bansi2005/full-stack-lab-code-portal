n:3,title:"A* Algorithm",lang:"Python",

input:"Start: A\nGoal: D",
output:"Path found: ['A', 'B', 'D']",
code:`import heapq

graph = {
    'A': [('B', 1), ('C', 3), ('D', 7)],
    'B': [('D', 5)],
    'C': [('D', 12)],
    'D': []
}

h = {'A': 1, 'B': 1, 'C': 1, 'D': 0}

def astar(start, goal):
    queue = [(h[start], 0, start, [start])]
    best = {start: 0}

    while queue:
        f, cost, node, path = heapq.heappop(queue)

        if node == goal:
            print("Path found:", path)
            return

        if cost != best[node]:
            continue

        for neighbour, weight in graph[node]:
            new_cost = cost + weight

            if new_cost < best.get(neighbour, float('inf')):
                best[neighbour] = new_cost
                new_path = path + [neighbour]
                heapq.heappush(
                    queue,
                    (new_cost + h[neighbour],
                     new_cost, neighbour, new_path)
                )

    print("Path does not exist")

landscape = np.random.randint(1, 100, (10, 10))

def hill_climb():
    x, y = 0, 0

    while True:
        best_x, best_y = x, y
        best_value = landscape[x][y]

        for dx, dy in [(0,1), (0,-1), (1,0), (-1,0)]:
            nx, ny = x + dx, y + dy

            if 0 <= nx < 10 and 0 <= ny < 10:

                    best_x, best_y = nx, ny
                    best_value = landscape[nx][ny]

        if (best_x, best_y) == (x, y):
            break

        x, y = best_x, best_y

graph = [

for route in permutations(vertices):
    cost = 0
    current = start

    for city in route:
        cost += graph[current][city]
        current = city

n:7,title:"Simulated Annealing",lang:"Python",

input:"Search range: -6 to 6\nIterations: 1200",
output:"A plot of the objective values is displayed.",
code:`import numpy as np
import matplotlib.pyplot as plt
from math import exp

def objective(x):
    return x[0] ** 2

def simulated_annealing():
    current = np.array([np.random.uniform(-6, 6)])
    best = current.copy()
    history = []

    for i in range(1200):
        temperature = 12 / (i + 1)

        new = current + np.random.randn(1) * 0.1
        new = np.clip(new, -6, 6)

        difference = objective(new) - objective(current)

        if difference < 0 or np.random.rand() < exp(-difference / temperature):
            current = new

        if objective(current) < objective(best):
            best = current.copy()

        history.append(objective(best))

    print("Best point:", best)
    print("Best value:", objective(best))

    plt.plot(history)
    plt.xlabel("Iterations")
    plt.ylabel("Objective Value")
    plt.show()

np.random.seed(1)

n:8,title:"8 Puzzle Problem",lang:"Python",
q:"Write a program to implement the 8 Puzzle Problem using Branch and Bound.",
desc:"Arrange the tiles into the goal configuration by moving the empty space.",
input:"Initial: [[1,2,3],[5,6,0],[7,8,4]]\nGoal: [[1,2,3],[5,8,6],[0,7,4]]",
output:"The solution moves are displayed.",
code:`import heapq

start = (1, 2, 3, 5, 6, 0, 7, 8, 4)
goal = (1, 2, 3, 5, 8, 6, 0, 7, 4)

def heuristic(state):
    return sum(
        state.index(i) != goal.index(i)
        for i in range(1, 9)
    )

def solve():
    queue = [(heuristic(start), 0, start, [])]
    visited = set()

    while queue:
        f, cost, state, path = heapq.heappop(queue)

        if state == goal:
            print("Solution moves:")
            for move in path:
                print(move)
            return

        if state in visited:
            continue

        visited.add(state)
        zero = state.index(0)
        row, col = divmod(zero, 3)

        moves = [
            (-1, 0, "UP"),
            (1, 0, "DOWN"),
            (0, -1, "LEFT"),
            (0, 1, "RIGHT")
        ]

        for dr, dc, name in moves:
            nr, nc = row + dr, col + dc

            if 0 <= nr < 3 and 0 <= nc < 3:
                pos = nr * 3 + nc
                new = list(state)
                new[zero], new[pos] = new[pos], new[zero]
                new = tuple(new)

                if new not in visited:
                    heapq.heappush(
                        queue,
                        (cost + 1 + heuristic(new),
                         cost + 1, new, path + [name])
                    )

    print("No solution found")

output:"Maximum value: 240.0",
note:"Important: The PDF question describes brute-force 0/1 Knapsack, but its supplied source code is Fractional Knapsack. The code below follows the actual source listing.",
code:`class Item:
    def __init__(self, value, weight):
        self.value = value
        self.weight = weight
        self.ratio = value / weight

def fractional_knapsack(values, weights, capacity):
    items = []

    for i in range(len(values)):
        items.append(Item(values[i], weights[i]))

    items.sort(key=lambda x: x.ratio, reverse=True)

    total = 0

    for item in items:
        if capacity >= item.weight:
            capacity -= item.weight
            total += item.value
        else:
            total += item.ratio * capacity
            break

    return total

values = [60, 40, 100, 120]
weights = [10, 40, 20, 30]
capacity = 50

print("Maximum value:",
      fractional_knapsack(values, weights, capacity))`

function login() {
    const pin = document.getElementById("pin").value;

    if (pin === "2580") {
        document.getElementById("login").style.display = "none";
        document.getElementById("portal").style.display = "block";
        showPrograms();
    } else {
        document.getElementById("error").textContent = "Incorrect PIN. Try again.";
    }
}

document.getElementById("pin").addEventListener("keydown", function(e) {
    if (e.key === "Enter") login();
});

    const search = document.getElementById("search").value.toLowerCase();
    const list = document.getElementById("programList");

    list.innerHTML = "";

    const filtered = programs.filter(p =>
        String(p.n).includes(search) ||
        p.title.toLowerCase().includes(search) ||
        p.q.toLowerCase().includes(search) ||
        p.lang.toLowerCase().includes(search)
    );

    if (filtered.length === 0) {
        list.innerHTML = "<p>No programs found.</p>";
        return;
    }

    filtered.forEach(p => {
        const card = document.createElement("div");
        card.className = "card";

        const heading = document.createElement("h3");
        heading.textContent = p.n + ". " + p.title;

        const question = document.createElement("p");
        question.textContent = p.q;

        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = p.lang;

        const desc = document.createElement("p");
        desc.textContent = p.desc;

        const view = document.createElement("button");
        view.className = "view";
        view.textContent = "View Code / Details";

        const copy = document.createElement("button");
        copy.textContent = "Copy Code";
        copy.disabled = !p.code;

        const details = document.createElement("div");
        details.className = "details";

        view.onclick = () => {
            details.style.display =
                details.style.display === "block" ? "none" : "block";
        };

        copy.onclick = async () => {
            try {
                await navigator.clipboard.writeText(p.code);
                copy.textContent = "Copied!";
                setTimeout(() => copy.textContent = "Copy Code", 1500);
            } catch (err) {
                const area = document.createElement("textarea");
                area.value = p.code;
                document.body.appendChild(area);
                area.select();
                document.execCommand("copy");
                area.remove();
                copy.textContent = "Copied!";
                setTimeout(() => copy.textContent = "Copy Code", 1500);
            }
        };

        details.appendChild(makeHeading("Question"));
        details.appendChild(makeText(p.q));

        details.appendChild(makeHeading("Description"));
        details.appendChild(makeText(p.desc));

        if (p.input) {
            details.appendChild(makeHeading("Input"));
            details.appendChild(makeText(p.input));
        }

        if (p.output) {
            details.appendChild(makeHeading("Expected Output"));
            details.appendChild(makeText(p.output));
        }

        if (p.note) {
            const note = makeText(p.note);
            note.className =
              
note.className = "note";
details.appendChild(makeHeading("Note"));
details.appendChild(note);
}

if (p.code) {
    details.appendChild(makeHeading("Source Code"));

    const pre = document.createElement("pre");
    const code = document.createElement("code");

    code.textContent = p.code;
    pre.appendChild(code);
    details.appendChild(pre);

} else {
    const note = makeText(
        "No standalone source code was provided in the PDF."
    );

    note.className = "note";
    details.appendChild(note);
}

card.appendChild(heading);
card.appendChild(question);
card.appendChild(tag);
card.appendChild(desc);
card.appendChild(view);
card.appendChild(copy);
card.appendChild(details);

list.appendChild(card);
});
}

function makeHeading(text) {
    const h = document.createElement("h4");
    h.textContent = text;
    return h;
}

function makeText(text) {
    const p = document.createElement("p");
    p.textContent = text;
    return p;
}
