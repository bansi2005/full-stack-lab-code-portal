
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thinkering Lab</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #000;
  color: white;
}

header {
  text-align: center;
  padding: 25px 10px;
  background: #111;
  border-bottom: 1px solid #444;
}

header h1 {
  font-size: 27px;
  margin-bottom: 8px;
}

header p {
  color: #aaa;
  font-size: 14px;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 25px 15px;
}

#login {
  max-width: 350px;
  margin: 100px auto;
  padding: 25px;
  background: #171717;
  border: 1px solid #444;
  border-radius: 8px;
  text-align: center;
}

#login h2 {
  margin-bottom: 15px;
}

input {
  width: 100%;
  padding: 12px;
  margin: 15px 0;
  background: #000;
  color: white;
  border: 1px solid #555;
  border-radius: 5px;
  font-size: 15px;
}

button {
  padding: 10px 16px;
  background: #333;
  color: white;
  border: 1px solid #555;
  border-radius: 5px;
  cursor: pointer;
  font-size: 13px;
}

button:hover {
  background: #555;
}

.login-btn {
  width: 100%;
}

#message {
  color: #ccc;
  margin-top: 12px;
}

#portal {
  display: none;
}

.heading {
  margin-bottom: 10px;
  font-size: 23px;
}

.subtitle {
  color: #aaa;
  margin-bottom: 20px;
  font-size: 14px;
}

.search {
  margin-bottom: 20px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 15px;
}

.card {
  background: #171717;
  border: 1px solid #444;
  padding: 20px;
  border-radius: 7px;
}

.card h3 {
  font-size: 17px;
  margin-bottom: 12px;
}

.card p {
  color: #aaa;
  font-size: 13px;
  line-height: 1.5;
  margin-bottom: 18px;
}

.buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

#viewer {
  display: none;
  background: #171717;
  border: 1px solid #555;
  border-radius: 7px;
  padding: 18px;
  margin-top: 25px;
}

.viewer-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 15px;
}

.viewer-top h2 {
  font-size: 18px;
}

pre {
  background: #000;
  padding: 15px;
  border: 1px solid #333;
  border-radius: 5px;
  overflow-x: auto;
  white-space: pre;
  color: #eee;
  font-size: 13px;
  line-height: 1.6;
}

footer {
  text-align: center;
  padding: 25px;
  color: #888;
  font-size: 12px;
}

@media(max-width: 500px) {
  header h1 {
    font-size: 23px;
  }

  .card {
    padding: 16px;
  }

  pre {
    font-size: 12px;
  }
}
</style>
</head>

<body>

<header>
  <h1>THINKERING LAB</h1>
  <p>Arduino Experiments - Code Portal</p>
</header>

<!-- LOGIN -->

<div id="login">
  <h2>Lab Access</h2>
  <p>Enter PIN to continue</p>

  <input type="password" id="pin"
  placeholder="Enter PIN">

  <button class="login-btn" onclick="login()">
    ENTER
  </button>

  <p id="message"></p>
</div>

<!-- MAIN PORTAL -->

<div id="portal" class="container">

  <h2 class="heading">Available Programs</h2>

  <p class="subtitle">
    Select an experiment to view or copy its code.
  </p>

  <input class="search" id="search"
  placeholder="Search experiments..."
  oninput="showCards()">

  <div class="cards" id="cards"></div>

  <!-- CODE VIEWER -->

  <div id="viewer">

    <div class="viewer-top">
      <h2 id="codeTitle"></h2>

      <div class="buttons">
        <button onclick="copyCode()">
          COPY CODE
        </button>

        <button onclick="closeCode()">
          CLOSE
        </button>
      </div>
    </div>

    <pre><code id="codeContent"></code></pre>

  </div>

</div>

<footer>
  THINKERING LAB | Arduino Programming
</footer>

<script>

// LOGIN FUNCTION

function login() {
  let pin = document.getElementById("pin").value;

  if (pin === "2580") {
    document.getElementById("login").style.display = "none";
    document.getElementById("portal").style.display = "block";
  } else {
    document.getElementById("message").innerText =
      "Incorrect PIN. Try again.";
  }
}

document.getElementById("pin").addEventListener("keydown", function(e) {
  if (e.key === "Enter") login();
});


// ARDUINO PROGRAMS

const programs = [

{
title: "Fire Sensor with LED and Buzzer",
description: "Detect fire using a sensor, LED and buzzer.",
code: `int led = 9;
int buzzer = 12;
int fire = 2;

void setup()
{
  pinMode(led, OUTPUT);
  pinMode(buzzer, OUTPUT);
  pinMode(fire, INPUT);

  Serial.begin(9600);
}

void loop()
{
  int value = digitalRead(fire);

  Serial.println(value);

  if (value == 0)
  {
    digitalWrite(led, HIGH);
    digitalWrite(buzzer, HIGH);
  }
  else
  {
    digitalWrite(led, LOW);
    digitalWrite(buzzer, LOW);
  }
}`
},

{
title: "Automatic Door using Ultrasonic Sensor",
description: "Automatically open and close a door using a servo motor.",
code: `#include <Servo.h>

Servo s;

int trig = 9;
int echo = 10;
int distance;
int time;

void setup()
{
  pinMode(trig, OUTPUT);
  pinMode(echo, INPUT);
  s.attach(6);
}

void loop()
{
  digitalWrite(trig, LOW);
  delayMicroseconds(2);

  digitalWrite(trig, HIGH);
  delayMicroseconds(10);
  digitalWrite(trig, LOW);

  time = pulseIn(echo, HIGH);
  distance = time * 0.034 / 2;

  if (distance < 10 && distance > 0)
  {
    s.write(90);
  }
  else
  {
    s.write(0);
  }

  delay(100);
}`
},

{
title: "Automatic Railway Gate",
description: "Control two railway gate arms using an ultrasonic sensor.",
code: `#include <Servo.h>

Servo right_servo;
Servo left_servo;

int trig = 8;
int echo = 9;
int time;
int distance;

void setup()
{
  Serial.begin(9600);

  pinMode(trig, OUTPUT);
  pinMode(echo, INPUT);

  right_servo.attach(10);
  left_servo.attach(11);
}

void loop()
{
  digitalWrite(trig, LOW);
  delayMicroseconds(2);

  digitalWrite(trig, HIGH);
  delayMicroseconds(10);
  digitalWrite(trig, LOW);

  time = pulseIn(echo, HIGH);
  distance = time * 0.034 / 2;

  Serial.println(distance);

  if (distance <= 10 && distance > 0)
  {
    right_servo.write(90);
    left_servo.write(90);
  }
  else
  {
    right_servo.write(0);
    left_servo.write(0);
  }

  delay(100);
}`
},

{
title: "Arduino Servo Dustbin Lock Control",
description: "Lock and unlock a dustbin using serial monitor commands.",
code: `#include <Servo.h>

Servo dustbin;

void setup()
{
  dustbin.attach(10);
  Serial.begin(9600);

  dustbin.write(0);

  Serial.println("Enter lock or unlock");
}

void loop()
{
  if (Serial.available())
  {
    String cmd = Serial.readStringUntil('\\n');
    cmd.trim();

    if (cmd == "lock")
    {
      dustbin.write(0);
      Serial.println("Dustbin Locked");
    }
    else if (cmd == "unlock")
    {
      dustbin.write(90);
      Serial.println("Dustbin Unlocked");
    }
    else
    {
      Serial.println("Invalid Command");
    }
  }
}`
},

{
title: "Arduino LED Blinking in Tinkercad",
description: "Blink three LEDs using Arduino digital pins.",
code: `void setup()
{
  pinMode(LED_BUILTIN, OUTPUT);
  pinMode(12, OUTPUT);
  pinMode(11, OUTPUT);
}

void loop()
{
  digitalWrite(LED_BUILTIN, HIGH);
  delay(400);
  digitalWrite(LED_BUILTIN, LOW);

  digitalWrite(12, HIGH);
  delay(400);
  digitalWrite(12, LOW);

  digitalWrite(11, HIGH);
  delay(400);
  digitalWrite(11, LOW);
}`
}

];


// DISPLAY CARDS

function showCards() {

  let search = document.getElementById("search")
    .value.toLowerCase();

  let html = "";

  programs.forEach((p, i) => {

    if ((p.title + p.description).toLowerCase().includes(search)) {

      html += `
        <div class="card">

          <h3>${i + 1}. ${p.title}</h3>

          <p>${p.description}</p>

          <div class="buttons">

            <button onclick="viewCode(${i})">
              VIEW CODE
            </button>

            <button onclick="copyProgram(${i}, this)">
              COPY CODE
            </button>

          </div>

        </div>
      `;
    }

  });

  document.getElementById("cards").innerHTML =
    html || "<p>No programs found.</p>";
}


// VIEW CODE

function viewCode(index) {

  document.getElementById("codeTitle").innerText =
    programs[index].title;

  document.getElementById("codeContent").textContent =
    programs[index].code;

  document.getElementById("viewer").style.display = "block";

  document.getElementById("viewer").scrollIntoView({
    behavior: "smooth"
  });
}


// COPY CODE

function copyProgram(index, button) {
  copyText(programs[index].code, button);
}

function copyCode() {

  let code = document.getElementById("codeContent").textContent;

  copyText(code, document.querySelector("#viewer .copy-btn") ||
    document.querySelector("#viewer .buttons button"));
}


// COPY FUNCTION

function copyText(code, button) {

  let oldText = button.innerText;

  function done() {
    button.innerText = "COPIED ✓";

    setTimeout(function() {
      button.innerText = oldText;
    }, 1500);
  }

  if (navigator.clipboard && window.isSecureContext) {

    navigator.clipboard.writeText(code)
      .then(done)
      .catch(function() {
        fallbackCopy(code, done);
      });

  } else {
    fallbackCopy(code, done);
  }
}


// FALLBACK COPY

function fallbackCopy(code, done) {

  let area = document.createElement("textarea");

  area.value = code;
  area.style.position = "fixed";
  area.style.opacity = "0";

  document.body.appendChild(area);
  area.select();

  try {
    if (document.execCommand("copy")) {
      done();
    } else {
      alert("Copy failed. Please copy manually.");
    }
  } catch (e) {
    alert("Copy failed. Please copy manually.");
  }

  document.body.removeChild(area);
}


// CLOSE VIEWER

function closeCode() {
  document.getElementById("viewer").style.display = "none";
}


// LOAD PROGRAMS

showCards();

</script>

</body>
</html>
