<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Full Stack Lab Code Portal</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#151f33;--line:#30415f;--txt:#f5f7ff;--muted:#aab6cc;--accent:#91aaff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.5 system-ui,Arial}
header,main{max-width:900px;margin:auto;padding-left:18px;padding-right:18px}header{padding:25px 18px 18px}
.tag{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.15em}h1{font-size:clamp(28px,5vw,40px);margin:6px 0}h2{font-size:22px;margin:7px 0}p{color:var(--muted);margin:5px 0}
main{padding-bottom:40px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:17px}
.set{background:linear-gradient(140deg,#1c2d4b,#131d30);color:var(--txt);border:1px solid var(--line);border-radius:15px;padding:17px;text-align:left;min-height:92px}
.set b{display:block;font-size:19px}.set small{color:var(--muted)}
.hidden{display:none!important}.back{background:transparent;border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:9px 13px;margin-bottom:17px}
.list{display:grid;gap:12px;margin-top:15px}.program{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px}
.meta{font-size:10px;color:var(--accent);font-weight:800;letter-spacing:.13em}.program h3{font-size:15px;line-height:1.4;margin:5px 0 13px}
.code{white-space:pre-wrap;overflow:auto;max-height:420px;background:#080d17;border:1px solid var(--line);border-radius:9px;padding:13px;font:12px/1.55 ui-monospace,monospace;margin:12px 0}
.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 14px;font-size:13px;font-weight:750;cursor:pointer}
.copy{background:#647ff0;color:white}.view{background:transparent;color:#dce5ff;border:1px solid #52688f}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style></head><body>
<header><div class="tag">FULL STACK DEVELOPMENT – 2</div><h1>Lab Code Portal</h1><p>Select your set, choose a program, and copy its code into your compiler.</p></header>
<main>
<section id="sets"><div class="tag">STEP 1</div><h2>Select your SET</h2><div class="grid" id="setGrid"></div></section>
<section id="programs" class="hidden"><button class="back" id="backSets">← Back to Sets</button><div class="tag">STEP 2</div><h2 id="setTitle"></h2><p>Choose a program, then copy its code.</p><div class="list" id="programList"></div></section>
</main>
<script>
const SETS=[{"name": "SET 1", "programs": [{"category": "JavaScript", "title": "Link an external JavaScript file with an HTML page", "code": "<!-- index.html -->\n<!DOCTYPE html>\n<html>\n<body>\n  <h1>Hello, World!<\/h1>\n  <script src=\"script.js\"><\/script>\n<\/body>\n<\/html>\n\n// script.js\nalert(\"JavaScript file is successfully linked!\");"}, {"category": "React", "title": "Counter button using a functional component", "code": "// App.js\nimport React, { useState } from \"react\";\n\nexport default function App() {\n  const [count, setCount] = useState(0);\n  return (\n    <div>\n      <h1>Counter: {count}<\/h1>\n      <button onClick={() => setCount(count + 1)}>Increment<\/button>\n    <\/div>\n  );\n}"}, {"category": "Express.js", "title": "Display Hello World in the browser using Express.js", "code": "// server.js\nconst express = require(\"express\");\nconst app = express();\n\napp.get(\"/\", (req, res) => res.send(\"Hello World\"));\n\napp.listen(3000, () => console.log(\"Server running on port 3000\"));"}, {"category": "MySQL", "title": "Create a database and a table inside it", "code": "CREATE DATABASE college;\nUSE college;\n\nCREATE TABLE students (\n  id INT PRIMARY KEY AUTO_INCREMENT,\n  name VARCHAR(50),\n  branch VARCHAR(30)\n);\n\nSHOW TABLES;\nDESCRIBE students;"}]}, {"name": "SET 2", "programs": [{"category": "JavaScript", "title": "Select HTML elements using DOM selectors", "code": "<!DOCTYPE html>\n<html>\n<body>\n  <h1 id=\"title\">Welcome<\/h1>\n  <p class=\"info\">First paragraph<\/p>\n  <p class=\"info\">Second paragraph<\/p>\n  <button onclick=\"showContent()\">Show<\/button>\n  <div id=\"output\"><\/div>\n  <script>\n    function showContent() {\n      const title = document.getElementById(\"title\").textContent;\n      const paragraphs = document.querySelectorAll(\".info\");\n      document.getElementById(\"output\").innerHTML =\n        title + \"<br>\" + [...paragraphs].map(p => p.textContent).join(\"<br>\");\n    }\n  <\/script>\n<\/body>\n<\/html>"}, {"category": "React", "title": "Handle button click events in a functional component", "code": "// App.js\nimport React, { useState } from \"react\";\n\nexport default function App() {\n  const [message, setMessage] = useState(\"Button not clicked\");\n  return (\n    <div>\n      <h2>{message}<\/h2>\n      <button onClick={() => setMessage(\"Button was clicked!\")}>Click Me<\/button>\n    <\/div>\n  );\n}"}, {"category": "React", "title": "Display text using string literals", "code": "// App.js\nimport React from \"react\";\n\nexport default function App() {\n  const name = \"Inbha\";\n  const message = `Hello, ${name}! Welcome to React.`;\n  return <h2>{message}<\/h2>;\n}"}, {"category": "MySQL", "title": "Insert and update data in a table", "code": "USE college;\n\nINSERT INTO students (name, branch)\nVALUES (\"Anu\", \"CSE\"), (\"Ravi\", \"ECE\");\n\nUPDATE students\nSET branch = \"CSE\"\nWHERE name = \"Ravi\";\n\nSELECT * FROM students;"}]}, {"name": "SET 3", "programs": [{"category": "JavaScript", "title": "Implement event listeners", "code": "<!DOCTYPE html>\n<html>\n<body>\n  <h2 id=\"heading\">Hover over me!<\/h2>\n  <button id=\"clickBtn\">Click Me<\/button>\n  <input id=\"textInput\" placeholder=\"Type something\">\n  <div id=\"output\"><\/div>\n  <script>\n    const output = document.getElementById(\"output\");\n    document.getElementById(\"clickBtn\").addEventListener(\"click\", () => {\n      output.textContent = \"Button was clicked!\";\n    });\n    document.getElementById(\"heading\").addEventListener(\"mouseover\", () => {\n      output.textContent = \"Mouse is over the heading!\";\n    });\n    document.getElementById(\"textInput\").addEventListener(\"input\", e => {\n      output.textContent = \"You typed: \" + e.target.value;\n    });\n  <\/script>\n<\/body>\n<\/html>"}, {"category": "React", "title": "Counter button using a class component", "code": "// App.js\nimport React, { Component } from \"react\";\n\nexport default class App extends Component {\n  state = { count: 0 };\n\n  render() {\n    return (\n      <div>\n        <h1>Counter: {this.state.count}<\/h1>\n        <button onClick={() => this.setState({ count: this.state.count + 1 })}>\n          Increment\n        <\/button>\n      <\/div>\n    );\n  }\n}"}, {"category": "Express.js", "title": "Develop a small website with multiple Express.js routes", "code": "// server.js\nconst express = require(\"express\");\nconst app = express();\n\napp.get(\"/\", (req, res) => res.send(\"Home Page\"));\napp.get(\"/about\", (req, res) => res.send(\"About Page\"));\napp.get(\"/contact\", (req, res) => res.send(\"Contact Page\"));\n\napp.listen(3000, () => console.log(\"Server running on port 3000\"));"}, {"category": "MySQL", "title": "Implement subqueries in MySQL", "code": "USE college;\n\nSELECT name\nFROM students\nWHERE id IN (\n  SELECT id\n  FROM students\n  WHERE branch = \"CSE\"\n);"}]}, {"name": "SET 4", "programs": [{"category": "JavaScript", "title": "Handle click events for HTML button elements", "code": "<!DOCTYPE html>\n<html>\n<body>\n  <h2>Click any button below:<\/h2>\n  <button id=\"btn1\">Button 1<\/button>\n  <button id=\"btn2\">Button 2<\/button>\n  <button id=\"btn3\">Button 3<\/button>\n  <div id=\"result\"><\/div>\n  <script>\n    const result = document.getElementById(\"result\");\n    document.getElementById(\"btn1\").addEventListener(\"click\", () => result.textContent = \"Button 1 was clicked!\");\n    document.getElementById(\"btn2\").addEventListener(\"click\", () => result.textContent = \"Button 2 was clicked!\");\n    document.getElementById(\"btn3\").addEventListener(\"click\", () => result.textContent = \"Button 3 was clicked!\");\n  <\/script>\n<\/body>\n<\/html>"}, {"category": "React", "title": "Implement a counter using the useState hook", "code": "// App.js\nimport React, { useState } from \"react\";\n\nexport default function App() {\n  const [count, setCount] = useState(0);\n  return (\n    <div>\n      <h1>Counter: {count}<\/h1>\n      <button onClick={() => setCount(count + 1)}>Increment<\/button>\n    <\/div>\n  );\n}"}, {"category": "React", "title": "Conditionally render a component in the browser", "code": "// App.js\nimport React, { useState } from \"react\";\n\nfunction Welcome() {\n  return <h2>Welcome to the site!<\/h2>;\n}\n\nexport default function App() {\n  const [show, setShow] = useState(false);\n  return (\n    <div>\n      <button onClick={() => setShow(!show)}>{show ? \"Hide\" : \"Show\"} Welcome<\/button>\n      {show && <Welcome />}\n    <\/div>\n  );\n}"}, {"category": "MySQL", "title": "Create and execute SQL script files using MySQL Workbench", "code": "-- Save as college.sql\nCREATE DATABASE IF NOT EXISTS college;\nUSE college;\n\nCREATE TABLE IF NOT EXISTS students (\n  id INT PRIMARY KEY AUTO_INCREMENT,\n  name VARCHAR(50),\n  branch VARCHAR(30)\n);\n\nINSERT INTO students (name, branch) VALUES (\"Anu\", \"CSE\");\nSELECT * FROM students;\n\n-- Open college.sql in MySQL Workbench and click Execute."}]}, {"name": "SET 5", "programs": [{"category": "JavaScript", "title": "Demonstrate function declaration, function definition and arrow functions", "code": "<!DOCTYPE html>\n<html>\n<body>\n  <button onclick=\"declaration()\">Function Declaration<\/button>\n  <button onclick=\"definition()\">Function Definition<\/button>\n  <button onclick=\"arrow()\">Arrow Function<\/button>\n  <p id=\"output\"><\/p>\n  <script>\n    function declaration() {\n      document.getElementById(\"output\").textContent = \"This is a Function Declaration.\";\n    }\n    var definition = function() {\n      document.getElementById(\"output\").textContent = \"This is a Function Definition.\";\n    };\n    const arrow = () => {\n      document.getElementById(\"output\").textContent = \"This is an Arrow Function.\";\n    };\n  <\/script>\n<\/body>\n<\/html>"}, {"category": "React", "title": "Fetch data from an API using the useEffect hook", "code": "// App.js\nimport React, { useEffect, useState } from \"react\";\n\nexport default function App() {\n  const [users, setUsers] = useState([]);\n  useEffect(() => {\n    fetch(\"https://jsonplaceholder.typicode.com/users\")\n      .then(res => res.json())\n      .then(data => setUsers(data));\n  }, []);\n\n  return (\n    <div>\n      <h2>Users<\/h2>\n      {users.map(user => <p key={user.id}>{user.name}<\/p>)}\n    <\/div>\n  );\n}"}, {"category": "Express.js", "title": "Implement CRUD operations using Express.js", "code": "// server.js\nconst express = require(\"express\");\nconst app = express();\napp.use(express.json());\n\nlet users = [{ id: 1, name: \"Alice\" }, { id: 2, name: \"Bob\" }];\n\napp.post(\"/users\", (req, res) => {\n  const user = { id: Date.now(), name: req.body.name };\n  users.push(user);\n  res.status(201).json(user);\n});\napp.get(\"/users\", (req, res) => res.json(users));\napp.get(\"/users/:id\", (req, res) => {\n  const user = users.find(u => u.id === Number(req.params.id));\n  if (!user) return res.status(404).json({ message: \"User not found\" });\n  res.json(user);\n});\napp.put(\"/users/:id\", (req, res) => {\n  const user = users.find(u => u.id === Number(req.params.id));\n  if (!user) return res.status(404).json({ message: \"User not found\" });\n  user.name = req.body.name;\n  res.json(user);\n});\napp.delete(\"/users/:id\", (req, res) => {\n  users = users.filter(u => u.id !== Number(req.params.id));\n  res.json({ message: \"User deleted\" });\n});\n\napp.listen(3000, () => console.log(\"Server running on port 3000\"));"}, {"category": "MySQL", "title": "Create a table, insert records and update records", "code": "CREATE DATABASE IF NOT EXISTS college;\nUSE college;\n\nCREATE TABLE students (\n  id INT PRIMARY KEY AUTO_INCREMENT,\n  name VARCHAR(50),\n  age INT,\n  grade VARCHAR(10)\n);\n\nINSERT INTO students (name, age, grade)\nVALUES (\"Rahul\", 15, \"10A\"), (\"Sneha\", 14, \"9B\"), (\"Arjun\", 16, \"11C\");\n\nUPDATE students SET grade = \"10B\" WHERE name = \"Sneha\";\nSELECT * FROM students;"}]}, {"name": "SET 6", "programs": [{"category": "JavaScript", "title": "Select HTML elements and change their content using DOM selectors", "code": "<!DOCTYPE html>\n<html>\n<body>\n  <h1 id=\"heading\">Old Heading<\/h1>\n  <p class=\"info\">Old paragraph<\/p>\n  <button onclick=\"changeContent()\">Change Content<\/button>\n  <script>\n    function changeContent() {\n      document.getElementById(\"heading\").textContent = \"New Heading\";\n      document.querySelector(\".info\").textContent = \"Content changed using DOM selectors\";\n    }\n  <\/script>\n<\/body>\n<\/html>"}, {"category": "React", "title": "Share data between two React components using props", "code": "// App.js\nimport React from \"react\";\n\nfunction Student(props) {\n  return <h2>Student Name: {props.name}<\/h2>;\n}\n\nexport default function App() {\n  return (\n    <div>\n      <h1>Parent Component<\/h1>\n      <Student name=\"Bansi\" />\n    <\/div>\n  );\n}"}, {"category": "Express.js", "title": "Print Hello World in the browser console using Express.js", "code": "// server.js\nconst express = require(\"express\");\nconst app = express();\n\napp.get(\"/\", (req, res) => {\n  res.send(`<!DOCTYPE html>\n  <html><body>\n    <h1>Hello from Express!<\/h1>\n    <script>console.log(\"Hello World from Express.js!\");<\/script>\n  <\/body><\/html>`);\n});\n\napp.listen(3000, () => console.log(\"Server running at http://localhost:3000\"));"}, {"category": "MySQL", "title": "Create a database directory and initialize database.sql for API integration", "code": "-- Project structure:\n-- project/\n--   server.js\n--   database/\n--     database.sql\n\n-- database/database.sql\nCREATE DATABASE IF NOT EXISTS testdb;\nUSE testdb;\n\nCREATE TABLE IF NOT EXISTS users (\n  id INT AUTO_INCREMENT PRIMARY KEY,\n  name VARCHAR(255) NOT NULL\n);\n\n-- Import/run this SQL file before connecting your Express API to MySQL."}]}, {"name": "SET 7", "programs": [{"category": "JavaScript", "title": "Implement event listeners for button click events", "code": "<!DOCTYPE html>\n<html>\n<body>\n  <button id=\"clickBtn\">Click Me<\/button>\n  <p id=\"output\">Waiting for click...<\/p>\n  <script>\n    document.getElementById(\"clickBtn\").addEventListener(\"click\", function() {\n      document.getElementById(\"output\").textContent = \"Button was clicked!\";\n    });\n  <\/script>\n<\/body>\n<\/html>"}, {"category": "React", "title": "Implement forms in React", "code": "// App.js\nimport React, { useState } from \"react\";\n\nexport default function App() {\n  const [name, setName] = useState(\"\");\n  function handleSubmit(event) {\n    event.preventDefault();\n    alert(\"Submitted: \" + name);\n  }\n  return (\n    <form onSubmit={handleSubmit}>\n      <input value={name} onChange={e => setName(e.target.value)} placeholder=\"Enter name\" />\n      <button type=\"submit\">Submit<\/button>\n    <\/form>\n  );\n}"}, {"category": "Git", "title": "Create a local Git repository, add files and commit them", "code": "git config --global user.name \"Your Name\"\ngit config --global user.email \"you@example.com\"\n\nmkdir myproject\ncd myproject\ngit init\n\necho \"# My Project\" > README.md\ngit add .\ngit commit -m \"Initial commit\"\ngit status"}, {"category": "MySQL", "title": "Create a database, create a table and insert data", "code": "CREATE DATABASE college;\nUSE college;\n\nCREATE TABLE students (\n  id INT PRIMARY KEY AUTO_INCREMENT,\n  name VARCHAR(50),\n  branch VARCHAR(30)\n);\n\nINSERT INTO students (name, branch)\nVALUES (\"Bansi\", \"CSE\"), (\"Ravi\", \"ECE\");\n\nSELECT * FROM students;"}]}, {"name": "SET 8", "programs": [{"category": "JavaScript", "title": "Demonstrate function declaration, function definition and arrow functions", "code": "<!DOCTYPE html>\n<html>\n<body>\n  <p id=\"output\"><\/p>\n  <script>\n    function declaration() { return \"Function Declaration\"; }\n    const definition = function() { return \"Function Definition\"; };\n    const arrow = () => \"Arrow Function\";\n    document.getElementById(\"output\").innerHTML =\n      declaration() + \"<br>\" + definition() + \"<br>\" + arrow();\n  <\/script>\n<\/body>\n<\/html>"}, {"category": "React", "title": "Render a list of items using the map() function", "code": "// App.js\nimport React from \"react\";\n\nexport default function App() {\n  const subjects = [\"JavaScript\", \"React\", \"Express\", \"MySQL\"];\n  return (\n    <div>\n      <h2>Subjects<\/h2>\n      <ul>{subjects.map((subject, index) => <li key={index}>{subject}<\/li>)}<\/ul>\n    <\/div>\n  );\n}"}, {"category": "Git", "title": "Connect a local repository to GitHub and push files to main", "code": "git init\ngit add .\ngit commit -m \"Initial commit\"\ngit branch -M main\n\n# Create an empty GitHub repository, then:\ngit remote add origin https://github.com/USERNAME/REPOSITORY.git\ngit push -u origin main"}, {"category": "MySQL", "title": "Implement subqueries in the MySQL command-line client", "code": "USE college;\n\nSELECT name\nFROM students\nWHERE id IN (\n  SELECT id\n  FROM students\n  WHERE branch = \"CSE\"\n);"}]}, {"name": "SET 9", "programs": [{"category": "JavaScript", "title": "Link an external JavaScript file and handle a button click event", "code": "<!-- index.html -->\n<!DOCTYPE html>\n<html>\n<body>\n  <button id=\"btn\">Click Me<\/button>\n  <p id=\"output\"><\/p>\n  <script src=\"script.js\"><\/script>\n<\/body>\n<\/html>\n\n// script.js\ndocument.getElementById(\"btn\").addEventListener(\"click\", () => {\n  document.getElementById(\"output\").textContent = \"Button clicked!\";\n});"}, {"category": "React", "title": "Implement a counter using the useState hook", "code": "// App.js\nimport React, { useState } from \"react\";\n\nexport default function App() {\n  const [count, setCount] = useState(0);\n  return <div><h2>Counter: {count}<\/h2><button onClick={() => setCount(count + 1)}>Increment<\/button><\/div>;\n}"}, {"category": "Git", "title": "Create a feature1 branch and merge it into main", "code": "git checkout -b feature1\n\n# Make changes to files, then commit:\ngit add .\ngit commit -m \"Add feature1\"\n\ngit checkout main\ngit merge feature1\ngit branch"}, {"category": "MySQL", "title": "Create and execute SQL script files using MySQL Workbench", "code": "-- Save as college.sql\nCREATE DATABASE IF NOT EXISTS college;\nUSE college;\n\nCREATE TABLE IF NOT EXISTS students (\n  id INT PRIMARY KEY AUTO_INCREMENT,\n  name VARCHAR(50),\n  branch VARCHAR(30)\n);\n\nINSERT INTO students (name, branch) VALUES (\"Kiran\", \"CSE\");\nSELECT * FROM students;\n\n-- Open this file in MySQL Workbench and click Execute."}]}, {"name": "SET 10", "programs": [{"category": "JavaScript", "title": "Select HTML elements using DOM selectors and implement event listeners", "code": "<!DOCTYPE html>\n<html>\n<body>\n  <h2 id=\"title\">Original Title<\/h2>\n  <button id=\"btn\">Change Title<\/button>\n  <script>\n    const title = document.querySelector(\"#title\");\n    document.querySelector(\"#btn\").addEventListener(\"click\", () => {\n      title.textContent = \"Title Changed!\";\n    });\n  <\/script>\n<\/body>\n<\/html>"}, {"category": "React", "title": "Fetch API data using useEffect and display it in the browser", "code": "// App.js\nimport React, { useEffect, useState } from \"react\";\n\nexport default function App() {\n  const [posts, setPosts] = useState([]);\n  useEffect(() => {\n    fetch(\"https://jsonplaceholder.typicode.com/posts?_limit=5\")\n      .then(res => res.json())\n      .then(data => setPosts(data));\n  }, []);\n  return (\n    <div>\n      <h2>Posts<\/h2>\n      {posts.map(post => <p key={post.id}>{post.title}<\/p>)}\n    <\/div>\n  );\n}"}, {"category": "Git", "title": "Configure Git username and email, create a GitHub repository and push files", "code": "git config --global user.name \"Your Name\"\ngit config --global user.email \"you@example.com\"\n\ngit init\ngit add .\ngit commit -m \"Initial commit\"\ngit branch -M main\n\n# Create an empty repository on GitHub, then:\ngit remote add origin https://github.com/USERNAME/REPOSITORY.git\ngit push -u origin main"}, {"category": "Express.js", "title": "Implement CRUD operations using Express.js", "code": "// server.js\nconst express = require(\"express\");\nconst app = express();\napp.use(express.json());\n\nlet users = [{ id: 1, name: \"Alice\" }, { id: 2, name: \"Bob\" }];\n\napp.post(\"/users\", (req, res) => {\n  const user = { id: Date.now(), name: req.body.name };\n  users.push(user);\n  res.status(201).json(user);\n});\napp.get(\"/users\", (req, res) => res.json(users));\napp.put(\"/users/:id\", (req, res) => {\n  const user = users.find(u => u.id === Number(req.params.id));\n  if (!user) return res.status(404).json({ message: \"User not found\" });\n  user.name = req.body.name;\n  res.json(user);\n});\napp.delete(\"/users/:id\", (req, res) => {\n  users = users.filter(u => u.id !== Number(req.params.id));\n  res.json({ message: \"User deleted\" });\n});\n\napp.listen(3000, () => console.log(\"Server running on port 3000\"));"}]}];
const grid=document.getElementById("setGrid"),list=document.getElementById("programList");
SETS.forEach((set,i)=>{
 const b=document.createElement("button");b.className="set";
 b.innerHTML="<b>"+set.name+"</b><small>4 assigned programs · Select →</small>";
 b.addEventListener("click",()=>{
  document.getElementById("setTitle").textContent=set.name+" — Programs";list.innerHTML="";
  set.programs.forEach((program,j)=>{
   const card=document.createElement("article");card.className="program";
   const meta=document.createElement("div");meta.className="meta";meta.textContent="PROGRAM "+(j+1)+" · "+program.category;
   const title=document.createElement("h3");title.textContent=program.title;
   const actions=document.createElement("div");actions.className="actions";
   const copy=document.createElement("button");copy.className="btn copy";copy.textContent="COPY CODE";
   const view=document.createElement("button");view.className="btn view";view.textContent="VIEW CODE";
   const code=document.createElement("pre");code.className="code hidden";code.textContent=program.code;
   view.addEventListener("click",()=>{code.classList.toggle("hidden");view.textContent=code.classList.contains("hidden")?"VIEW CODE":"HIDE CODE";});
   copy.addEventListener("click",async()=>{
    try{
     await navigator.clipboard.writeText(program.code);
     copy.textContent="COPIED ✓";
    }catch(e){
     code.classList.remove("hidden");
     view.textContent="HIDE CODE";
     copy.textContent="SELECT CODE BELOW";
    }
    setTimeout(()=>{copy.textContent="COPY CODE";},1800);
   });
   actions.append(copy,view);card.append(meta,title,actions,code);list.appendChild(card);
  });
  document.getElementById("sets").classList.add("hidden");
  document.getElementById("programs").classList.remove("hidden");window.scrollTo(0,0);
 });
 grid.appendChild(b);
});
document.getElementById("backSets").addEventListener("click",()=>{
 document.getElementById("programs").classList.add("hidden");
 document.getElementById("sets").classList.remove("hidden");window.scrollTo(0,0);
});
</script></body></html>
